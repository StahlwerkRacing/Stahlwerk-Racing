<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stahlwerk Racing</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
}
header{
    background:#222;
    text-align:center;
    padding:25px;
    border-bottom:4px solid #f7c600;
}
h1{color:#f7c600;}
nav{
    display:flex;
    justify-content:center;
    gap:10px;
    background:#1a1a1a;
    padding:10px;
}
nav button{
    background:#333;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}
nav button:hover{background:#f7c600;color:#111;}
section{padding:20px;display:none;}
section.active{display:block;}
.card{
    background:#222;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}
input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
}
button.main{
    width:100%;
    background:#f7c600;
    color:#111;
    border:none;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}
.driver{
    background:#333;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:10px;
    border-bottom:1px solid #444;
}
th{color:#f7c600;}
</style>
</head>

<body>

<header>
<h1>🏁 Stahlwerk Racing</h1>
<p>GT7 SimRacing Team</p>
</header>

<nav>
<button onclick="show('start')">Start</button>
<button onclick="show('anmeldung')">Anmeldung</button>
<button onclick="show('fahrer')">Fahrer</button>
<button onclick="show('tabelle')">Tabelle</button>
</nav>

<section id="start" class="active">
<div class="card">
<h2>Willkommen!</h2>
<p>Offizielle Website von Stahlwerk Racing.</p>
<p><b>Nächster Lauf:</b> Nürburgring • Samstag 20:00</p>
</div>
</section>

<section id="anmeldung">
<div class="card">
<h2>Für einen Cup anmelden</h2>

<input id="name" placeholder="PSN Name">
<input id="nr" type="number" placeholder="Startnummer">

<select id="cup">
<option>Unter der Woche</option>
<option>Samstag</option>
<option>Sonntag</option>
</select>

<button class="main" onclick="anmelden()">Eintragen</button>
</div>
</section>

<section id="fahrer">
<div class="card">
<h2>Fahrerliste</h2>
<div id="liste"></div>
</div>
</section>

<section id="tabelle">
<div class="card">
<h2>Meisterschaft</h2>
<table>
<thead>
<tr>
<th>Platz</th>
<th>Fahrer</th>
<th>Punkte</th>
</tr>
</thead>
<tbody id="punkte"></tbody>
</table>
</div>
</section>

<script>
let fahrer=[];

function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

function anmelden(){
const n=document.getElementById("name").value;
const nr=document.getElementById("nr").value;
const cup=document.getElementById("cup").value;

if(n=="") return;

fahrer.push({
name:n,
nr:nr,
cup:cup,
punkte:0
});

document.getElementById("name").value="";
document.getElementById("nr").value="";

show("fahrer");
}

function render(){
let l=document.getElementById("liste");
l.innerHTML="";

fahrer.forEach(f=>{
l.innerHTML+=`
<div class="driver">
<b>#${f.nr} ${f.name}</b><br>
${f.cup}
</div>`;
});

let p=document.getElementById("punkte");
p.innerHTML="";

fahrer.sort((a,b)=>b.punkte-a.punkte);

fahrer.forEach((f,i)=>{
p.innerHTML+=`
<tr>
<td>${i+1}</td>
<td>#${f.nr} ${f.name}</td>
<td>${f.punkte}</td>
</tr>`;
});
}
</script>

</body>
</html>
