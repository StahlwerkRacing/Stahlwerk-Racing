<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stahlwerk Racing V4</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
}
header{
    background:#222;
    padding:25px;
    text-align:center;
    border-bottom:4px solid #f7c600;
}
h1{color:#f7c600;margin:0;}
nav{
    display:flex;
    justify-content:center;
    gap:8px;
    background:#1a1a1a;
    padding:10px;
    flex-wrap:wrap;
}
nav button{
    background:#333;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
nav button:hover{
    background:#f7c600;
    color:#111;
}
section{display:none;padding:20px;}
section.active{display:block;}
.card{
    background:#222;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}
input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
}
.main{
    width:100%;
    padding:12px;
    background:#f7c600;
    color:#111;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}
.driver{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#333;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
}
.small{
    background:#c62828;
    color:white;
    border:none;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:10px;
    border-bottom:1px solid #444;
    text-align:left;
}
th{color:#f7c600;}
.notice{
    background:#3b3000;
    padding:10px;
    border-radius:8px;
    color:#ffe082;
}
</style>
</head>

<body>

<header>
<h1>🏁 Stahlwerk Racing</h1>
<p>GT7 Endurance League</p>
</header>

<nav>
<button onclick="show('start')">Start</button>
<button onclick="show('anmeldung')">Anmeldung</button>
<button onclick="show('fahrer')">Fahrer</button>
<button onclick="show('tabelle')">Tabelle</button>
<button onclick="show('admin')">Admin</button>
</nav>

<section id="start" class="active">
<div class="card">
<h2>Willkommen</h2>
<p>Nächster Lauf: Nürburgring • Samstag 20:00</p>
</div>
</section>

<section id="anmeldung">
<div class="card">
<h2>Fahrer anmelden</h2>

<input id="name" placeholder="PSN Name">
<input id="nr" type="number" placeholder="Startnummer">

<select id="car">
  <optgroup label="Gr.3">
    <option>Alfa Romeo 4C Gr.3</option>
    <option>Aston Martin DBR9 GT1</option>
    <option>Aston Martin V12 Vantage Gr.3</option>
    <option>Audi R8 LMS Evo Gr.3</option>
    <option>BMW M3 GT</option>
    <option>BMW M6 GT3</option>
    <option>Chevrolet Corvette C7 Gr.3</option>
    <option>Ferrari 458 Italia GT3</option>
    <option>Ferrari 488 GT3</option>
    <option>Ferrari 296 GT3</option>
    <option>Ford GT LM Spec II</option>
    <option>Genesis X GR3</option>
    <option>Honda NSX Gr.3</option>
    <option>Jaguar F-Type Gr.3</option>
    <option>Lamborghini Huracán GT3</option>
    <option>Lexus RC F GT3</option>
    <option>McLaren 650S GT3</option>
    <option>Mercedes-AMG GT3</option>
    <option>Nissan GT-R NISMO GT3</option>
    <option>Peugeot RCZ Gr.3</option>
    <option>Porsche 911 RSR (991)</option>
    <option>Renault R.S.01 GT3</option>
    <option>Subaru BRZ GT300</option>
    <option>Suzuki Vision Gr.3</option>
    <option>Toyota GR Supra Racing Concept</option>
    <option>Volkswagen Beetle Gr.3</option>
  </optgroup>

  <optgroup label="Gr.2">
    <option>Honda NSX GT500 '16</option>
    <option>Lexus RC F GT500 '16</option>
    <option>Nissan GT-R GT500 '16</option>
  </optgroup>

  <optgroup label="Gr.1">
    <option>Toyota GR010 Hybrid</option>
    <option>Toyota TS050 Hybrid</option>
    <option>Porsche 919 Hybrid</option>
    <option>Audi R18 TDI</option>
    <option>Peugeot 908 HDi FAP</option>
    <option>Mazda 787B</option>
    <option>Sauber Mercedes C9</option>
  </optgroup>

  <optgroup label="Gr.4">
    <option>Alfa Romeo 4C Gr.4</option>
    <option>Audi TT Cup</option>
    <option>BMW M4 Gr.4</option>
    <option>Bugatti Veyron Gr.4</option>
    <option>Chevrolet Corvette Gr.4</option>
    <option>Ferrari 458 Gr.4</option>
    <option>Ford Mustang Gr.4</option>
    <option>Jaguar F-Type Gr.4</option>
    <option>Lamborghini Huracán Gr.4</option>
    <option>McLaren 650S Gr.4</option>
    <option>Mercedes-AMG SLS Gr.4</option>
    <option>Nissan GT-R Gr.4</option>
    <option>Porsche Cayman GT4 Clubsport</option>
    <option>Subaru WRX Gr.4</option>
    <option>Toyota GR Supra Gr.4</option>
  </optgroup>
</select>

<select id="cup">
<option>Unter der Woche</option>
<option>Samstag</option>
<option>Sonntag</option>
</select>

<button class="main" onclick="register()">Eintragen</button>

</div>
</section>

<section id="fahrer">
<div class="card">
<h2>Fahrer</h2>
<div id="driverList"></div>
</div>
</section>

<section id="tabelle">
<div class="card">
<h2>Meisterschaft</h2>
<table>
<thead>
<tr>
<th>Platz</th>
<th>Fahrer</th>
<th>Punkte</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</section>

<section id="admin">

<div id="loginBox" class="card">
<div class="notice">Admin Login</div>
<input id="pw" type="password" placeholder="Passwort">
<button class="main" onclick="login()">Einloggen</button>
</div>

<div id="adminPanel" style="display:none;">

<div class="card">
<h2>🏆 Punkte vergeben</h2>

<select id="driverSelect"></select>

<input id="pts" type="number" placeholder="25">

<button class="main" onclick="givePoints()">Punkte vergeben</button>
</div>

<div class="card">
<h2>🗑 Fahrer löschen</h2>
<div id="adminDrivers"></div>
</div>

</div>

</section>

<script>
const PASSWORD="stahlwerk26";

let drivers=JSON.parse(localStorage.getItem("stahlwerkDrivers")||"[]");
let admin=false;

function save(){
localStorage.setItem("stahlwerkDrivers",JSON.stringify(drivers));
render();
}

function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

function register(){

  const d = {
    name: document.getElementById("name").value.trim(),
    nr: document.getElementById("nr").value,
    car: document.getElementById("car").value,
    cup: document.getElementById("cup").value,
    points: 0
  };

  if(d.name === "") return;

  drivers.push(d);

  document.getElementById("name").value = "";
  document.getElementById("nr").value = "";

  save();
  show("fahrer");
}


function render(){

let list=document.getElementById("driverList");
list.innerHTML="";

drivers.forEach(d=>{
list.innerHTML+=`
<div class="driver">
<div>
<b>#${d.nr} ${d.name}</b><br>
<small>${d.car} • ${d.cup}</small>
</div>
<div>${d.points} P</div>
</div>`;
});

let body=document.getElementById("tableBody");
body.innerHTML="";

let sorted=[...drivers].sort((a,b)=>b.points-a.points);

sorted.forEach((d,i)=>{
body.innerHTML+=`
<tr>
<td>${i+1}</td>
<td>#${d.nr} ${d.name}</td>
<td>${d.points}</td>
</tr>`;
});

let sel=document.getElementById("driverSelect");
sel.innerHTML="";

drivers.forEach((d,i)=>{
sel.innerHTML+=`<option value="${i}">#${d.nr} ${d.name}</option>`;
});

let ad=document.getElementById("adminDrivers");
ad.innerHTML="";

drivers.forEach((d,i)=>{
ad.innerHTML+=`
<div class="driver">
<span>#${d.nr} ${d.name}</span>
<button class="small" onclick="removeDriver(${i})">Löschen</button>
</div>`;
});

const loginBox = document.getElementById("loginBox");
const adminPanel = document.getElementById("adminPanel");

if(admin){
  loginBox.style.display = "none";
  adminPanel.style.display = "block";
}else{
  loginBox.style.display = "block";
  adminPanel.style.display = "none";
}

}

function login(){

if(pw.value===PASSWORD){
admin=true;
render();
}else{
alert("Falsches Passwort");
}

}

function givePoints(){

let i=driverSelect.value;
let p=Number(pts.value);

if(isNaN(p)) return;

drivers[i].points+=p;

pts.value="";

save();

}

function removeDriver(i){

if(confirm("Fahrer löschen?")){
drivers.splice(i,1);
save();
}

}

render()

</script>

</body>
</html>
