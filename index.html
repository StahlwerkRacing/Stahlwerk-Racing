.notice{

</style>

id="pw"
type="password"
placeholder="Passwort">

class="main"

Einloggen

id="adminPanel"
style="display:none;">

id="pts"
type="number"
placeholder="Punkte">

class="main"
onclick="givePoints()">

Punkte vergeben

</button>

<h2>🗑️ Fahrer löschen</h2>

<div id="adminDrivers"></div>

</div>

<script>

/* ==================================================
   SUPABASE EINSTELLUNGEN
================================================== */

const SUPABASE_URL =
"https://apvstlhttuaeenqdcrtk.supabase.co";


const SUPABASE_KEY =
"sb_publishable_2CZK_bsj_HSMLlSax9eAGQ_xWF90ibr";


/* ==================================================
   ADMIN PASSWORT
================================================== */

const PASSWORD =
"stahlwerk26";


/* ==================================================
   VARIABLEN
================================================== */

let drivers = [];

let admin = false;


/* ==================================================
   SUPABASE ANFRAGE
================================================== */

async function supabaseRequest(
    url,
    options = {}
){

    options.headers = {

        "apikey": SUPABASE_KEY,

        "Authorization":
        "Bearer " + SUPABASE_KEY,

        "Content-Type":
        "application/json",

        ...(options.headers || {})

    };

    return await fetch(
        url,
        options
    );
}


/* ==================================================
   FAHRER LADEN
================================================== */

async function loadDrivers(){

    try{

        const response =
        await supabaseRequest(
            SUPABASE_URL +
            "/rest/v1/drivers?select=*&order=id.asc"
        );


        if(!response.ok){

            const error =
            await response.text();

            console.error(error);

            document.getElementById(
                "driverList"
            ).innerHTML =

            `<div class="error">
            Fahrer konnten nicht geladen werden.
            </div>`;

            return;
        }


        drivers =
        await response.json();


        render();

    }

    catch(error){

        console.error(error);

        document.getElementById(
            "driverList"
        ).innerHTML =

        `<div class="error">
        Keine Verbindung zur Datenbank.
        </div>`;

    }

}


/* ==================================================
   FAHRER REGISTRIEREN
================================================== */

async function register(){

    const name =
    document.getElementById(
        "name"
    ).value.trim();


    const nummer =
    document.getElementById(
        "nr"
    ).value;


    const auto =
    document.getElementById(
        "car"
    ).value;


    const cup =
    document.getElementById(
        "cup"
    ).value;


    const message =
    document.getElementById(
        "registerMessage"
    );


    if(name === ""){

        message.innerHTML =
        `<div class="error">
        Bitte einen PSN Namen eingeben.
        </div>`;

        return;

    }


    if(nummer === ""){

        message.innerHTML =
        `<div class="error">
        Bitte eine Startnummer eingeben.
        </div>`;

        return;

    }

const data = {
    name: name,
    nummer: Number(nummer),
    auto: auto,
    cup: cup,
    meisterschaft: document.getElementById("meisterschaft").value,
    points: 0
};

    };


    try{

        const response =
        await supabaseRequest(

            SUPABASE_URL +
            "/rest/v1/drivers",

            {

                method:"POST",

                headers:{

                    "Prefer":
                    "return=minimal"

                },

                body:
                JSON.stringify(data)

            }

        );


        if(!response.ok){

            const error =
            await response.text();

            console.error(error);

            message.innerHTML =
            `<div class="error">
            Fahrer konnte nicht eingetragen werden.
            </div>`;

            return;

        }


        message.innerHTML =
        `<div class="success">
        ✅ Fahrer erfolgreich eingetragen!
        </div>`;


        document.getElementById(
            "name"
        ).value = "";


        document.getElementById(
            "nr"
        ).value = "";


        await loadDrivers();


        setTimeout(
            function(){

                show("fahrer");

            },
            500
        );

    }

    catch(error){

        console.error(error);

        message.innerHTML =
        `<div class="error">
        Fehler bei der Verbindung zur Datenbank.
        </div>`;

    }

}


/* ==================================================
   SEITEN WECHSELN
================================================== */

function show(id){

    document
    .querySelectorAll("section")
    .forEach(
        function(section){

            section.classList.remove(
                "active"
            );

        }
    );


    document
    .getElementById(id)
    .classList.add("active");


    render();

}


/* ==================================================
   WEBSITE RENDERN
================================================== */

function render(){


    /* FAHRER */

    const list =
    document.getElementById(
        "driverList"
    );


    if(drivers.length === 0){

        list.innerHTML =
        `<div class="empty">
        Noch keine Fahrer angemeldet.
        </div>`;

    }

    else{

        list.innerHTML = "";


       sorted.forEach(
            function(driver){

                list.innerHTML += `

                <div class="driver">

                    <div>

                        <b>
                        #${driver.nummer}
                        ${escapeHTML(driver.name)}
                        </b>

                        <br>

                        <small>
                        ${escapeHTML(driver.auto)}
                        •
                        ${escapeHTML(driver.cup)}
                        </small>

                    </div>

                    <div>
                        ${driver.points || 0} P
                    </div>

                </div>

                `;

            }
        );

    }


    /* MEISTERSCHAFT */

    const body =
    document.getElementById(
        "tableBody"
    );


    body.innerHTML = "";

const liga = document.getElementById("filter").value;

const sorted = drivers
  .filter(driver => driver.meisterschaft === liga)
  .sort((a, b) => Number(b.points || 0) - Number(a.points || 0)); );

        }
    );


    sorted.forEach(
        function(driver,index){

            body.innerHTML += `

            <tr>

                <td>
                ${index + 1}
                </td>

                <td>
                #${driver.nummer}
                ${escapeHTML(driver.name)}
                </td>

                <td>
                ${driver.points || 0}
                </td>

            </tr>

            `;

        }
    );


    /* ADMIN AUSWAHL */

    const select =
    document.getElementById(
        "driverSelect"
    );


    select.innerHTML = "";


    drivers.forEach(
        function(driver,index){

            select.innerHTML += `

            <option value="${index}">

            #${driver.nummer}
            ${escapeHTML(driver.name)}

            </option>

            `;

        }
    );


    /* ADMIN LÖSCHEN */

    const adminDrivers =
    document.getElementById(
        "adminDrivers"
    );


    adminDrivers.innerHTML = "";


    if(drivers.length === 0){

        adminDrivers.innerHTML =
        `<div class="empty">
        Keine Fahrer vorhanden.
        </div>`;

    }


    drivers.forEach(
        function(driver,index){

            adminDrivers.innerHTML += `

            <div class="driver">

                <span>

                #${driver.nummer}
                ${escapeHTML(driver.name)}

                </span>


                <button
                class="small"
                onclick="removeDriver(${index})">

                Löschen

                </button>

            </div>

            `;

        }
    );


    /* ADMIN PANEL */

    const loginBox =
    document.getElementById(
        "loginBox"
    );


    const adminPanel =
    document.getElementById(
        "adminPanel"
    );


    if(admin){

        loginBox.style.display =
        "none";

        adminPanel.style.display =
        "block";

    }

    else{

        loginBox.style.display =
        "block";

        adminPanel.style.display =
        "none";

    }

}


/* ==================================================
   HTML SICHER MACHEN
================================================== */

function escapeHTML(text){

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    text ?? "";

    return div.innerHTML;

}


/* ==================================================
   ADMIN LOGIN
================================================== */

function login(){

    const password =
    document.getElementById(
        "pw"
    ).value;


    if(password === PASSWORD){

        admin = true;

        render();

    }

    else{

        alert(
            "Falsches Passwort"
        );

    }

}


/* ==================================================
   PUNKTE VERGEBEN
================================================== */

async function givePoints(){

    const index =
    document.getElementById(
        "driverSelect"
    ).value;


    const points =
    Number(
        document.getElementById(
            "pts"
        ).value
    );


    const driver =
    drivers[index];


    const message =
    document.getElementById(
        "pointsMessage"
    );


    if(!driver){

        return;

    }


    if(isNaN(points)){

        message.innerHTML =
        `<div class="error">
        Bitte eine Punktzahl eingeben.
        </div>`;

        return;

    }


    const newPoints =
    Number(
        driver.points || 0
    )
    +
    points;


    try{

        const response =
        await supabaseRequest(

            SUPABASE_URL +
            "/rest/v1/drivers?id=eq." +
            driver.id,

            {

                method:"PATCH",

                body:
                JSON.stringify({

                    points:
                    newPoints

                })

            }

        );


        if(!response.ok){

            console.error(
                await response.text()
            );

            message.innerHTML =
            `<div class="error">
            Punkte konnten nicht gespeichert werden.
            </div>`;

            return;

        }


        document.getElementById(
            "pts"
        ).value = "";


        message.innerHTML =
        `<div class="success">
        ✅ Punkte gespeichert!
        </div>`;


        await loadDrivers();

    }

    catch(error){

        console.error(error);

        message.innerHTML =
        `<div class="error">
        Fehler beim Speichern.
        </div>`;

    }

}


/* ==================================================
   FAHRER LÖSCHEN
================================================== */

async function removeDriver(index){

    const driver =
    drivers[index];


    if(!driver){

        return;

    }


    if(
        !confirm(
            "Fahrer wirklich löschen?"
        )
    ){

        return;

    }


    try{

        const response =
        await supabaseRequest(

            SUPABASE_URL +
            "/rest/v1/drivers?id=eq." +
            driver.id,

            {

                method:"DELETE"

            }

        );


        if(!response.ok){

            console.error(
                await response.text()
            );

            alert(
                "Fahrer konnte nicht gelöscht werden."
            );

            return;

        }


        await loadDrivers();

    }

    catch(error){

        console.error(error);

        alert(
            "Fehler beim Löschen."
        );

    }

}


/* ==================================================
   START
================================================== */

loadDrivers();

</script>
